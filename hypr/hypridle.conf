general {
    # Nix: lock_cmd = "${pkgs.procps}/bin/pidof hyprlock || ${pkgs.hyprlock}/bin/hyprlock"
    lock_cmd = pidof hyprlock || hyprlock       
    
    # Nix: unlock_cmd = "${pkgs.procps}/bin/pkill -USR1 hyprlock"
    unlock_cmd = pkill -USR1 hyprlock           
    
    # Nix: before_sleep_cmd = lock-session (loginctl lock-session)
    before_sleep_cmd = loginctl lock-session    
    
    # Nix: after_sleep_cmd = "${hyprctl} dispatch dpms on"
    after_sleep_cmd = hyprctl dispatch dpms on  
}

# Optional: You likely want a listener to actually trigger the lock
# Since your Nix snippet only had 'general' settings, you may want to add this:
listener {
    timeout = 300                                # 5 minutes
    on-timeout = loginctl lock-session           # lock screen when timeout has passed
}

listener {
    timeout = 330                                # 5.5 minutes
    on-timeout = hyprctl dispatch dpms off       # screen off when timeout has passed
    on-resume = hyprctl dispatch dpms on         # screen on when activity is detected
}
